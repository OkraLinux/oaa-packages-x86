name: build-oaa

on:
  workflow_dispatch:
    inputs:
      package:
        description: comma separated package names, empty means all
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-oaa
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.collect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: collect
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            value=$(printf '%s' "${{ inputs.package }}" | tr ',' '\n' | tr ' ' '\n' | sed '/^$/d' \
              | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')
            echo "packages=$value" >> "$GITHUB_OUTPUT"
          else
            value=$(ls packages/*.conf | xargs -n1 basename | sed 's/\.conf$//' | sort \
              | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')
            echo "packages=$value" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.list.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool pkg-config \
            texinfo gettext bison gawk m4 patch curl xz-utils zstd wget file gperf flex \
            libgmp-dev libmpfr-dev libmpc-dev meson ninja-build fakeroot lzip autopoint
      - name: build ${{ matrix.package }}
        run: bash scripts/build-package.sh "${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: oaa-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/okra-artifacts/
            out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: oaa-*
          path: collected
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          [ -d collected/_temp/okra-artifacts ] && cp -a collected/_temp/okra-artifacts/. out/ || true
          [ -d collected/out ] && cp -a collected/out/. out/ || true
          bash scripts/publish.sh out